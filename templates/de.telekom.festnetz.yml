issuer: Telekom Deutschland GmbH
keywords:
  - Festnetz-Rechnung
  - Rechnungsbetrag
  - Telekom
fields:
  amount:
    parser: regex
    regex: rechnungsbetrag\s*([\d.]+,\d{2})\s*€?
    type: float
  customer_number:
    parser: regex
    regex: kundennummer\s*([\d\s]+)
    replace: ['\s+', '']
    type: int
  date:
    parser: regex
    regex: datum\s*(\d{2}\.\d{2}\.\d{4})
    type: date
  item:
    parser: regex
    regex: festnetz-rechnung\s*für\s*([a-z]+\s*\d{4})
    replace: ['\s+', '_']
  invoice_number:
    group: first
    parser: regex
    regex: rechnungsnummer\s*([\d\s]+)
    replace: ['\s+', '']
    type: int
options:
  currency: EUR
  date_formats: '%d.%m.%Y'
  decimal_separator: ','
  lowercase: true
